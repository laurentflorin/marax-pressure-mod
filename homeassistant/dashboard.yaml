# Mara X dashboard
# https://github.com/laurentflorin/marax-pressure-mod
#
# Paste the whole file into a dashboard's raw configuration editor:
#   Settings → Dashboards → (your dashboard) → ⋮ → Edit → ⋮ → Raw configuration editor
#
# The recipes view needs marax-recipe-card.js registered as a resource first —
# see doc/homeassistant/homeassistant.md. Everything else uses built-in cards
# only, so the rest of the dashboard still works if that card is missing.
#
# Entity IDs assume Home Assistant slugged the device as `mara_x`. Check under
# Developer Tools → States with the filter `mara_x`; if yours differ (a repeated
# discovery can leave a `_2` suffix behind), search and replace them here.

title: Mara X

views:
  # ────────────────────────────────────────────────────────────────────────
  - title: Machine
    path: machine
    icon: mdi:coffee-maker
    cards:
      # The controller sets a retained "offline" through its MQTT last will, so
      # every entity goes unavailable together when the ESP32 drops off. Worth
      # saying plainly rather than showing a wall of dashes.
      - type: conditional
        conditions:
          - entity: binary_sensor.mara_x_power
            state: unavailable
        card:
          type: markdown
          content: |-
            ## ⚠️ Controller offline

            The ESP32 is not connected to MQTT. Readings below are stale.

      # Machine off, controller fine: the temperature entities are power-gated
      # so they go unavailable rather than reporting a misleading 0 °C.
      - type: conditional
        conditions:
          - entity: binary_sensor.mara_x_power
            state: "off"
        card:
          type: markdown
          content: |-
            ### Machine is switched off

            Temperatures resume within a few seconds of powering it on.

      - type: conditional
        conditions:
          - entity: binary_sensor.mara_x_power
            state: "on"
        card:
          type: horizontal-stack
          cards:
            - type: gauge
              entity: sensor.mara_x_brew_temperature
              name: Brew
              unit: °C
              min: 20
              max: 110
              needle: true
              segments:
                - from: 20
                  color: "#3f8fd0"
                - from: 88
                  color: "#43a047"
                - from: 97
                  color: "#f0a30a"
                - from: 103
                  color: "#db4437"
            - type: gauge
              entity: sensor.mara_x_steam_temperature
              name: Steam
              unit: °C
              min: 20
              max: 145
              needle: true
              segments:
                - from: 20
                  color: "#3f8fd0"
                - from: 115
                  color: "#43a047"
                - from: 132
                  color: "#f0a30a"
                - from: 140
                  color: "#db4437"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.mara_x_power
            name: Machine
            icon: mdi:power
          - type: tile
            entity: binary_sensor.mara_x_heating_element
            name: Heating
            icon: mdi:heating-coil
          - type: tile
            entity: sensor.mara_x_steam_target_temperature
            name: Steam target
            icon: mdi:target
          - type: tile
            entity: sensor.mara_x_shot_count
            name: Shots
            icon: mdi:coffee

      # What the next shot will be, and a quick way to change it.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: select.mara_x_recipe
            name: Recipe
            icon: mdi:notebook-outline
            features:
              - type: select-options
          - type: tile
            entity: switch.mara_x_brew_by_recipe
            name: Brew by recipe
            icon: mdi:notebook-check-outline
            features:
              - type: toggle

      # Fast heat only means anything while it is counting down.
      - type: conditional
        conditions:
          - entity: sensor.mara_x_fast_heat_countdown
            state_not: "0"
          - entity: sensor.mara_x_fast_heat_countdown
            state_not: unavailable
          - entity: sensor.mara_x_fast_heat_countdown
            state_not: unknown
        card:
          type: tile
          entity: sensor.mara_x_fast_heat_countdown
          name: Fast heat remaining
          icon: mdi:fire

      - type: history-graph
        title: Temperatures
        hours_to_show: 3
        entities:
          - entity: sensor.mara_x_brew_temperature
            name: Brew
          - entity: sensor.mara_x_steam_temperature
            name: Steam
          - entity: binary_sensor.mara_x_heating_element
            name: Heating

  # ────────────────────────────────────────────────────────────────────────
  - title: Recipes
    path: recipes
    icon: mdi:notebook-outline
    cards:
      - type: custom:marax-recipe-card
        title: Recipes
        # prefix: marax   # only if you changed the MQTT topic prefix

      # Every save, select, delete and tile change is answered here.
      - type: conditional
        conditions:
          - entity: sensor.mara_x_recipe_command_result
            state_not: unknown
          - entity: sensor.mara_x_recipe_command_result
            state_not: unavailable
        card:
          type: tile
          entity: sensor.mara_x_recipe_command_result
          name: Last recipe command
          icon: mdi:message-alert-outline

      - type: markdown
        content: |-
          A recipe is one coffee, dialled in: grind setting, dose, yield,
          temperature switch position and its own pressure curve. **Use**
          sets the machine up for it — the yield becomes the brew-by-weight
          target. Up to three recipes can sit on the machine's home screen;
          tapping one there does the same and opens the brew page, which
          then shows what to grind, dose and set the switch to.


          With **Brew by recipe** off the machine brews as a stock Mara X:
          full pump, no weight cut-off.


          The grind and the temperature switch are guidance only: the
          controller cannot turn either of them.

  # ────────────────────────────────────────────────────────────────────────
  - title: Diagnostics
    path: diagnostics
    icon: mdi:wrench
    cards:
      - type: entities
        title: Controller
        entities:
          - entity: binary_sensor.mara_x_power
            name: Power state
          - entity: sensor.mara_x_serial_frame
            name: Raw GiCar frame
          - entity: select.mara_x_recipe
            name: Selected recipe
          - entity: switch.mara_x_brew_by_recipe
            name: Brew by recipe
          - entity: sensor.mara_x_recipe_command_result
            name: Last recipe command

      - type: entities
        title: Readings
        entities:
          - entity: sensor.mara_x_brew_temperature
          - entity: sensor.mara_x_steam_temperature
          - entity: sensor.mara_x_steam_target_temperature
          - entity: sensor.mara_x_fast_heat_countdown
          - entity: sensor.mara_x_shot_count
          - entity: binary_sensor.mara_x_heating_element

      - type: markdown
        title: MQTT topics
        content: |-
          | Topic | Meaning |
          | --- | --- |
          | `marax/status` | `online` / `offline`, the controller's last will |
          | `marax/recipe/list` | Recipes on the SD card |
          | `marax/recipe/active` | Selected recipe, or `(none)` |
          | `marax/recipe/home` | The three home tiles |
          | `marax/recipe/mode` | Brew by recipe, `ON` / `OFF` |
          | `marax/recipe/body/<name>` | Every recipe file, as on the card |
          | `marax/recipe/result` | Answer to the last recipe command |
          | `marax/recipe/select` | Send a recipe name, or `(none)` |
          | `marax/recipe/save/<name>` | Send a recipe CSV to write it |
          | `marax/recipe/delete/<name>` | Send anything to delete it |
          | `marax/recipe/home/set` | Send `a,b,c` to assign the tiles |
          | `marax/recipe/mode/set` | Send `ON` or `OFF` |
