<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="1100" height="780" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">MaraX Pressure Mod — Wiring Diagram</text>

  <!-- Legend -->
  <rect x="20" y="50" width="200" height="165" fill="#0f3460" rx="8" stroke="#444" stroke-width="1"/>
  <text x="120" y="70" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">Legend</text>
  <line x1="35" y1="88" x2="75" y2="88" stroke="#ff4444" stroke-width="3"/>
  <text x="85" y="93" fill="#e0e0e0" font-size="12">5V / VCC Power</text>
  <line x1="35" y1="108" x2="75" y2="108" stroke="#222ecc" stroke-width="3"/>
  <text x="85" y="113" fill="#e0e0e0" font-size="12">GND</text>
  <line x1="35" y1="128" x2="75" y2="128" stroke="#44cc44" stroke-width="3"/>
  <text x="85" y="133" fill="#e0e0e0" font-size="12">Signal / Data</text>
  <line x1="35" y1="148" x2="75" y2="148" stroke="#ffaa00" stroke-width="3"/>
  <text x="85" y="153" fill="#e0e0e0" font-size="12">Analog Signal</text>
  <line x1="35" y1="168" x2="75" y2="168" stroke="#cc44ff" stroke-width="3"/>
  <text x="85" y="173" fill="#e0e0e0" font-size="12">Serial TX/RX</text>
  <line x1="35" y1="188" x2="75" y2="188" stroke="#ff8800" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="85" y="193" fill="#e0e0e0" font-size="12">230V AC (DANGER)</text>
  <text x="85" y="208" fill="#ff8800" font-size="10">⚠ High Voltage</text>

  <!-- ===================== ARDUINO NANO 33 IOT ===================== -->
  <rect x="420" y="290" width="180" height="260" fill="#00467f" rx="8" stroke="#4af" stroke-width="2"/>
  <text x="510" y="312" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Arduino Nano</text>
  <text x="510" y="328" text-anchor="middle" fill="#adf" font-size="10">33 IoT (SAMD21)</text>

  <!-- Left pins (labels inside, dots on left edge) -->
  <!-- 5V -->
  <circle cx="420" cy="355" r="5" fill="#ff4444"/>
  <text x="428" y="359" fill="#ffd0d0" font-size="10">5V</text>
  <!-- GND -->
  <circle cx="420" cy="375" r="5" fill="#222ecc"/>
  <text x="428" y="379" fill="#d0d0ff" font-size="10">GND</text>
  <!-- A0 - Pressure -->
  <circle cx="420" cy="395" r="5" fill="#ffaa00"/>
  <text x="428" y="399" fill="#ffe0b0" font-size="10">A0</text>
  <!-- D2 - Dimmer ZC -->
  <circle cx="420" cy="415" r="5" fill="#44cc44"/>
  <text x="428" y="419" fill="#d0ffd0" font-size="10">D2</text>
  <!-- D3 - Dimmer PWM -->
  <circle cx="420" cy="435" r="5" fill="#44cc44"/>
  <text x="428" y="439" fill="#d0ffd0" font-size="10">D3</text>
  <!-- D4 - Relay -->
  <circle cx="420" cy="455" r="5" fill="#44cc44"/>
  <text x="428" y="459" fill="#d0ffd0" font-size="10">D4</text>

  <!-- Right pins -->
  <!-- 3.3V -->
  <circle cx="600" cy="355" r="5" fill="#ff4444"/>
  <text x="565" y="359" fill="#ffd0d0" font-size="10">3.3V</text>
  <!-- GND -->
  <circle cx="600" cy="375" r="5" fill="#222ecc"/>
  <text x="565" y="379" fill="#d0d0ff" font-size="10">GND</text>
  <!-- TX1 - Nextion -->
  <circle cx="600" cy="395" r="5" fill="#cc44ff"/>
  <text x="548" y="399" fill="#e8b0ff" font-size="10">TX1 (D1)</text>
  <!-- RX1 - Nextion -->
  <circle cx="600" cy="415" r="5" fill="#cc44ff"/>
  <text x="548" y="419" fill="#e8b0ff" font-size="10">RX1 (D0)</text>

  <!-- ===================== PRESSURE SENSOR ===================== -->
  <rect x="50" y="300" width="160" height="100" fill="#1a4a1a" rx="8" stroke="#44cc44" stroke-width="2"/>
  <text x="130" y="322" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Pressure Sensor</text>
  <text x="130" y="338" text-anchor="middle" fill="#aaffaa" font-size="10">G1/4 · 0.5-4.5V</text>
  <!-- Sensor pins -->
  <circle cx="210" cy="360" r="5" fill="#ff4444"/>
  <text x="160" y="364" fill="#ffd0d0" font-size="10">VCC (5V)</text>
  <circle cx="210" cy="378" r="5" fill="#222ecc"/>
  <text x="160" y="382" fill="#d0d0ff" font-size="10">GND</text>
  <circle cx="210" cy="396" r="5" fill="#ffaa00"/>
  <text x="160" y="400" fill="#ffe0b0" font-size="10">Signal (A0)</text>

  <!-- Pressure sensor wires to Arduino -->
  <!-- VCC red -->
  <path d="M210,360 Q310,360 310,355 L420,355" stroke="#ff4444" stroke-width="2.5" fill="none"/>
  <!-- GND blue -->
  <path d="M210,378 Q315,378 315,375 L420,375" stroke="#222ecc" stroke-width="2.5" fill="none"/>
  <!-- Signal orange -->
  <path d="M210,396 Q320,396 320,395 L420,395" stroke="#ffaa00" stroke-width="2.5" fill="none"/>

  <!-- ===================== AC DIMMER ===================== -->
  <rect x="50" y="450" width="160" height="130" fill="#4a1a00" rx="8" stroke="#ff8800" stroke-width="2"/>
  <text x="130" y="470" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">AC Dimmer</text>
  <text x="130" y="485" text-anchor="middle" fill="#ffcc88" font-size="10">230V · RobotDyn</text>
  <!-- Dimmer pins -->
  <circle cx="210" cy="505" r="5" fill="#ff4444"/>
  <text x="155" y="509" fill="#ffd0d0" font-size="10">VCC (5V)</text>
  <circle cx="210" cy="521" r="5" fill="#222ecc"/>
  <text x="155" y="525" fill="#d0d0ff" font-size="10">GND</text>
  <circle cx="210" cy="537" r="5" fill="#44cc44"/>
  <text x="155" y="541" fill="#d0ffd0" font-size="10">ZC → D2</text>
  <circle cx="210" cy="553" r="5" fill="#44cc44"/>
  <text x="155" y="557" fill="#d0ffd0" font-size="10">PWM ← D3</text>
  <!-- AC in/out -->
  <circle cx="130" cy="570" r="5" fill="#ff8800"/>
  <text x="85" y="574" fill="#ffcc88" font-size="10">AC IN ⚡</text>
  <circle cx="130" cy="560" r="5" fill="#ff8800"/>

  <!-- Dimmer wires to Arduino -->
  <!-- VCC -->
  <path d="M210,505 Q340,505 340,355 L420,355" stroke="#ff4444" stroke-width="2.5" fill="none" stroke-dasharray="5,2"/>
  <!-- GND -->
  <path d="M210,521 Q345,521 345,375 L420,375" stroke="#222ecc" stroke-width="2.5" fill="none" stroke-dasharray="5,2"/>
  <!-- ZC signal -->
  <path d="M210,537 Q350,537 350,415 L420,415" stroke="#44cc44" stroke-width="2.5" fill="none"/>
  <!-- PWM signal -->
  <path d="M210,553 Q355,553 355,435 L420,435" stroke="#44cc44" stroke-width="2.5" fill="none" stroke-dasharray="8,2"/>

  <!-- AC high voltage path (dashed orange) -->
  <text x="50" y="600" fill="#ff8800" font-size="10" font-weight="bold">⚠ 230V AC: Machine → Dimmer → Pump</text>
  <path d="M50,610 L240,610" stroke="#ff8800" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="250" y="614" fill="#ff8800" font-size="10">→ Vibration Pump</text>

  <!-- ===================== RELAY ===================== -->
  <rect x="720" y="290" width="160" height="100" fill="#2a1a4a" rx="8" stroke="#cc44ff" stroke-width="2"/>
  <text x="800" y="310" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Relay</text>
  <text x="800" y="325" text-anchor="middle" fill="#ddb0ff" font-size="10">5V Coil</text>
  <!-- Relay pins -->
  <circle cx="720" cy="348" r="5" fill="#ff4444"/>
  <text x="728" y="352" fill="#ffd0d0" font-size="10">VCC (5V)</text>
  <circle cx="720" cy="366" r="5" fill="#222ecc"/>
  <text x="728" y="370" fill="#d0d0ff" font-size="10">GND</text>
  <circle cx="720" cy="384" r="5" fill="#44cc44"/>
  <text x="728" y="388" fill="#d0ffd0" font-size="10">IN ← D4</text>

  <!-- Relay wires from Arduino -->
  <!-- VCC -->
  <path d="M600,355 Q660,355 660,348 L720,348" stroke="#ff4444" stroke-width="2.5" fill="none"/>
  <!-- GND -->
  <path d="M600,375 Q660,375 660,366 L720,366" stroke="#222ecc" stroke-width="2.5" fill="none"/>
  <!-- Signal from D4 -->
  <path d="M420,455 Q405,455 405,455 Q390,455 390,630 Q880,630 880,384 L880,384 Q880,384 880,384 L879,384" stroke="#44cc44" stroke-width="2.5" fill="none"/>
  <path d="M879,384 L720,384" stroke="#44cc44" stroke-width="2.5" fill="none"/>

  <!-- ===================== NEXTION TOUCHSCREEN ===================== -->
  <rect x="720" y="430" width="200" height="130" fill="#1a3a4a" rx="8" stroke="#cc44ff" stroke-width="2"/>
  <text x="820" y="452" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Nextion 2.4"</text>
  <text x="820" y="468" text-anchor="middle" fill="#aaddff" font-size="10">Touchscreen Display</text>
  <!-- Nextion pins -->
  <circle cx="720" cy="490" r="5" fill="#ff4444"/>
  <text x="728" y="494" fill="#ffd0d0" font-size="10">VCC (5V)</text>
  <circle cx="720" cy="508" r="5" fill="#222ecc"/>
  <text x="728" y="512" fill="#d0d0ff" font-size="10">GND</text>
  <circle cx="720" cy="526" r="5" fill="#cc44ff"/>
  <text x="728" y="530" fill="#e8b0ff" font-size="10">RX ← TX1(D1)</text>
  <circle cx="720" cy="544" r="5" fill="#cc44ff"/>
  <text x="728" y="548" fill="#e8b0ff" font-size="10">TX → RX1(D0)</text>

  <!-- Nextion wires from Arduino -->
  <!-- VCC (5V) -->
  <path d="M600,355 Q680,355 680,490 L720,490" stroke="#ff4444" stroke-width="2.5" fill="none" stroke-dasharray="5,2"/>
  <!-- GND -->
  <path d="M600,375 Q685,375 685,508 L720,508" stroke="#222ecc" stroke-width="2.5" fill="none" stroke-dasharray="5,2"/>
  <!-- TX purple -->
  <path d="M600,395 Q690,395 690,526 L720,526" stroke="#cc44ff" stroke-width="2.5" fill="none"/>
  <!-- RX purple dashed -->
  <path d="M600,415 Q695,415 695,544 L720,544" stroke="#cc44ff" stroke-width="2.5" fill="none" stroke-dasharray="8,2"/>

  <!-- ===================== 5V POWER SUPPLY NOTE ===================== -->
  <rect x="420" y="610" width="220" height="60" fill="#0f3460" rx="8" stroke="#ff4444" stroke-width="1.5"/>
  <text x="530" y="630" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">5V Power Supply</text>
  <text x="530" y="648" text-anchor="middle" fill="#ffaaaa" font-size="10">Powers Arduino + Sensor</text>
  <text x="530" y="663" text-anchor="middle" fill="#ffaaaa" font-size="10">+ Dimmer + Relay + Nextion</text>

  <!-- Power supply arrows to Arduino -->
  <path d="M530,610 L530,580 L510,580 L510,550" stroke="#ff4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== LABELS / ANNOTATIONS ===================== -->
  <!-- Pressure sensor note -->
  <text x="50" y="420" fill="#88ff88" font-size="10">Tapped from brew group</text>
  <text x="50" y="432" fill="#88ff88" font-size="10">line via T-connector + 5mm pipe</text>

  <!-- Wire color summary at bottom -->
  <rect x="20" y="695" width="1060" height="72" fill="#0f3460" rx="8" stroke="#444" stroke-width="1"/>
  <text x="550" y="713" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">Pin Summary</text>
  <text x="30"  y="730" fill="#ff8888" font-size="11">Arduino 5V → Sensor VCC, Dimmer VCC, Relay VCC</text>
  <text x="30"  y="746" fill="#8888ff" font-size="11">Arduino GND → Sensor GND, Dimmer GND, Relay GND, Nextion GND</text>
  <text x="30"  y="762" fill="#88ff88" font-size="11">D2←ZC  D3→PWM(Dimmer)  D4→Relay IN</text>
  <text x="580" y="730" fill="#ee88ff" font-size="11">TX1(D1)→Nextion RX  |  RX1(D0)←Nextion TX</text>
  <text x="580" y="746" fill="#ffcc44" font-size="11">A0 ← Pressure Sensor Signal (0.5–4.5 V analog)</text>
  <text x="580" y="762" fill="#ff8800" font-size="11">⚠ 230V AC: Mains → Dimmer AC-IN/AC-OUT → Vibration Pump</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff4444"/>
    </marker>
  </defs>
</svg>
